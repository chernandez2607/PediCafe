<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">PediCafé</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/pedicafe.css}" rel="stylesheet">
    <link th:href="@{/css/usuarios.css}" rel="stylesheet">
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/rutinas.js}" defer></script>
</head>

<aside th:fragment="sidebar(active)" class="pc-sidebar">
    <a class="pc-brand" th:href="@{/menu}">
        <span class="pc-brand-name" th:text="#{app.name}">PediCafé</span>
        <span class="pc-brand-caption" th:text="#{brand.caption}">Gestión de cafetería</span>
    </a>
    <nav class="pc-sidebar-nav" aria-label="Navegación principal">
        <!-- Para todos -->
        <a class="pc-nav-link" th:classappend="${active == 'inicio'} ? ' active' : ''" th:href="@{/menu}">
            <span class="pc-nav-mark">⌂</span><span th:text="#{nav.home}">Inicio</span>
        </a>
        <a class="pc-nav-link" th:classappend="${active == 'menu'} ? ' active' : ''" th:href="@{/menu}">
            <span class="pc-nav-mark">☕</span><span th:text="#{nav.menu}">Menú</span>
        </a>
        <a class="pc-nav-link" th:classappend="${active == 'carrito'} ? ' active' : ''" th:href="@{/carrito}">
            <span class="pc-nav-mark" aria-hidden="true">🛒</span>
            <span th:text="#{nav.cart}">Carrito</span>
            <span class="badge rounded-pill bg-light text-dark ms-auto" th:text="${cantidadCarrito}">0</span>
        </a>

        <!-- Solo clientes -->
        <a class="pc-nav-link" th:if="${esCliente}" th:classappend="${active == 'pedidos'} ? ' active' : ''" th:href="@{/pedidos/historial}">
            <span class="pc-nav-mark" aria-hidden="true">▤</span>
            <span th:text="#{order.history.title}">Mis pedidos</span>
        </a>

        <!-- Personal: administrador, barista y cajero -->
        <th:block th:if="${esAdmin or esBarista or esCajero}">
            <p class="pc-nav-section" th:text="#{nav.section.admin}">Administración</p>
            <a class="pc-nav-link" th:classappend="${active == 'panel'} ? ' active' : ''" th:href="@{/admin}">
                <span class="pc-nav-mark">◧</span><span th:text="#{nav.panel}">Panel</span>
            </a>
            <a class="pc-nav-link" th:if="${esAdmin}" th:classappend="${active == 'productos'} ? ' active' : ''" th:href="@{/admin/productos}">
                <span class="pc-nav-mark">▦</span><span th:text="#{nav.products}">Productos</span>
            </a>
            <a class="pc-nav-link" th:if="${esAdmin}" th:classappend="${active == 'categorias'} ? ' active' : ''" th:href="@{/admin/categorias}">
                <span class="pc-nav-mark">◫</span><span th:text="#{nav.categories}">Categorías</span>
            </a>
            <a class="pc-nav-link" th:if="${esAdmin or esBarista}" th:classappend="${active == 'inventario'} ? ' active' : ''" th:href="@{/admin/inventario}">
                <span class="pc-nav-mark">▣</span><span th:text="#{nav.inventory}">Inventario</span>
            </a>
            <a class="pc-nav-link" th:if="${esAdmin or esBarista}" th:classappend="${active == 'recetas'} ? ' active' : ''" th:href="@{/admin/recetas}">
                <span class="pc-nav-mark">✎</span><span th:text="#{nav.recipes}">Recetas</span>
            </a>
            <a class="pc-nav-link" th:if="${esAdmin or esCajero}" th:classappend="${active == 'reportes'} ? ' active' : ''" th:href="@{/admin/reportes}">
                <span class="pc-nav-mark">▥</span><span th:text="#{nav.reports}">Reportes</span>
            </a>
            <a class="pc-nav-link" th:if="${esAdmin}" th:classappend="${active == 'usuarios'} ? ' active' : ''" th:href="@{/admin/usuarios}">
                <span class="pc-nav-mark">☺</span><span th:text="#{nav.users}">Usuarios</span>
            </a>
            <a class="pc-nav-link" th:if="${esAdmin}" th:classappend="${active == 'roles'} ? ' active' : ''" th:href="@{/admin/roles}">
                <span class="pc-nav-mark">⚑</span><span th:text="#{nav.roles}">Roles</span>
            </a>
        </th:block>

        <!-- Cuenta -->
        <p class="pc-nav-section" th:text="#{nav.section.account}">Mi cuenta</p>
        <th:block th:unless="${autenticado}">
            <a class="pc-nav-link" th:classappend="${active == 'login'} ? ' active' : ''" th:href="@{/login}">
                <span class="pc-nav-mark">→</span><span th:text="#{nav.login}">Iniciar sesión</span>
            </a>
            <a class="pc-nav-link" th:classappend="${active == 'registro'} ? ' active' : ''" th:href="@{/registro}">
                <span class="pc-nav-mark">＋</span><span th:text="#{nav.register}">Crear cuenta</span>
            </a>
        </th:block>
        <th:block th:if="${autenticado}">
            <a class="pc-nav-link" th:classappend="${active == 'perfil'} ? ' active' : ''" th:href="@{/perfil}">
                <span class="pc-nav-mark">◉</span>
                <span th:text="${nombreUsuario} ?: #{nav.profile}">Mi perfil</span>
            </a>
            <!-- El logout debe ser POST-->
            <form class="m-0" method="post" th:action="@{/logout}">
                <button class="pc-nav-link pc-nav-button" type="submit">
                    <span class="pc-nav-mark">⏻</span><span th:text="#{nav.logout}">Cerrar sesión</span>
                </button>
            </form>
        </th:block>
    </nav>
</aside>

<header th:fragment="pageHeader(eyebrow, title, subtitle)" class="pc-page-header">
    <div>
        <p class="pc-eyebrow" th:text="${eyebrow}">PediCafé</p>
        <h1 th:text="${title}">Título</h1>
        <p class="pc-page-subtitle" th:if="${subtitle != null and !#strings.isEmpty(subtitle)}" th:text="${subtitle}">Descripción</p>
    </div>
    <a class="pc-header-home" th:href="@{/menu}" th:attr="aria-label=#{accessibility.goToMenu}">P</a>
</header>

<th:block th:fragment="flashMessages">
    <div class="alert alert-success pc-alert" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-danger pc-alert" th:if="${error}" th:text="${error}"></div>
</th:block>

<div th:fragment="formError" class="alert alert-danger pc-alert" th:if="${error}" th:text="${error}"></div>

<section th:fragment="confirmarEliminar(accionEliminar, nombreId, tituloConfirmacion, mensajeConfirmacion)">
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form th:action="${accionEliminar}" method="post">
                    <input type="hidden" th:attr="name=${nombreId}" id="modalId">
                    <div class="modal-header bg-warning text-white">
                        <h5 class="modal-title" id="modalLabel" th:text="${tituloConfirmacion}">Eliminar</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                th:attr="aria-label=#{accessibility.close}"></button>
                    </div>
                    <div class="modal-body">
                        <p th:text="${mensajeConfirmacion}">Confirme la eliminación.</p>
                        <p class="fw-semibold mb-0" id="modalDescripcion"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-outline-danger" th:text="${tituloConfirmacion}">Eliminar</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                                th:text="#{form.cancel}">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
