<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Cola de pedidos - PediCafé</title>
    <a th:href="@{/barista/validar-retiro}"
       class="btn btn-primary mb-3">
        Validar código de retiro
    </a>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

    <div class="container mt-5">

        <h2 class="mb-4">Cola de pedidos - Barista</h2>

        <div th:if="${mensaje}" class="alert alert-success"
             th:text="${mensaje}"></div>

        <div th:if="${error}" class="alert alert-danger"
             th:text="${error}"></div>

        <div th:if="${#lists.isEmpty(pedidos)}"
             class="alert alert-info">
            No hay pedidos pendientes de preparación.
        </div>

        <div th:each="pedido : ${pedidos}"
             class="card mb-4 shadow-sm">

            <div class="card-body">

                <h5 class="card-title">
                    Pedido:
                    <span th:text="${pedido.numeroPedido}"></span>
                </h5>

                <p>
                    <strong>Estado:</strong>
                    <span th:text="${pedido.estadoActual}"></span>
                </p>

                <p>
                    <strong>Tipo de pedido:</strong>
                    <span th:text="${pedido.tipoPedido}"></span>
                </p>

                <p>
                    <strong>Fecha:</strong>
                    <span th:text="${pedido.fechaPedido}"></span>
                </p>

                <p>
                    <strong>Total:</strong>
                    ₡<span th:text="${pedido.total}"></span>
                </p>

                <p>
                    <strong>Notas:</strong>
                    <span th:text="${pedido.notas}"></span>
                </p>

                <a th:href="@{/detalle-pedido/{id}(id=${pedido.idPedido})}"
                   class="btn btn-outline-primary btn-sm">
                    Ver detalle
                </a>

                <form th:action="@{/barista/actualizar}"
                      method="post" class="mt-3">

                    <input type="hidden" name="idPedido"
                           th:value="${pedido.idPedido}">

                    <label class="form-label">
                        Nuevo estado:
                    </label>

                    <select name="nuevoEstado"
                            class="form-select mb-2" required>

                        <option value="">Seleccione</option>

                        <option th:if="${pedido.estadoActual == 'RECIBIDO'}"
                                value="EN_PREPARACION">
                            En preparación
                        </option>

                        <option th:if="${pedido.estadoActual == 'EN_PREPARACION'}"
                                value="LISTO">
                            Listo
                        </option>

                        <option th:if="${pedido.estadoActual == 'LISTO'}"
                                value="ENTREGADO">
                            Entregado
                        </option>

                    </select>

                    <label class="form-label">
                        ID del usuario que registra:
                    </label>

                    <input type="number" name="idUsuario"
                           class="form-control mb-2" required>

                    <label class="form-label">
                        Observación:
                    </label>

                    <input type="text" name="observacion"
                           class="form-control mb-3">

                    <button type="submit" class="btn btn-success">
                        Actualizar estado
                    </button>

                </form>

            </div>
        </div>

    </div>

</body>
</html>
