<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Detalle del pedido - PediCafé</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>
    <body class="bg-light">

        <div class="container mt-4 mb-5">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Detalle del pedido</h2>
                <a th:href="@{/barista/cola}" class="btn btn-secondary">
                    Volver a la cola
                </a>
            </div>

            <div class="card mb-4">
                <div class="card-header">
                    Información del pedido
                </div>

                <div class="card-body">
                    <p><strong>Número de pedido:</strong>
                        <span th:text="${pedido.numeroPedido}"></span>
                    </p>

                    <p><strong>Tipo de pedido:</strong>
                        <span th:text="${pedido.tipoPedido}"></span>
                    </p>

                    <p><strong>Estado:</strong>
                        <span th:text="${pedido.estadoActual}"></span>
                    </p>

                    <p><strong>Fecha:</strong>
                        <span th:text="${pedido.fechaPedido}"></span>
                    </p>

                    <p><strong>Fecha de retiro:</strong>
                        <span th:text="${pedido.fechaRetiro}"></span>
                    </p>

                    <p><strong>Código de retiro:</strong>
                        <span th:text="${pedido.codigoRetiro}"></span>
                    </p>

                    <p><strong>Notas:</strong>
                        <span th:text="${pedido.notas}"></span>
                    </p>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    Productos del pedido
                </div>

                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Cantidad</th>
                                    <th>Precio unitario</th>
                                    <th>Subtotal</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="detalle : ${detalles}">
                                    <td th:text="${detalle.nombreProductoSnapshot}"></td>
                                    <td th:text="${detalle.cantidad}"></td>
                                    <td th:text="${detalle.precioUnitarioSnapshot}"></td>
                                    <td th:text="${detalle.subtotalLinea}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <h5 class="text-end mt-3">
                        Total:
                        <span th:text="${pedido.total}"></span>
                    </h5>
                </div>
            </div>

        </div>

    </body>
</html>
