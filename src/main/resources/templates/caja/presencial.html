<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Caja - PediCafé</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>

    <body class="bg-light">

        <div class="container mt-4 mb-5">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Registro de pedidos presenciales</h2>

                <a th:href="@{/barista/cola}" class="btn btn-secondary">
                    Cola de pedidos
                </a>
            </div>

            <!-- Mensajes -->
            <div th:if="${mensaje}"
                 class="alert alert-success"
                 th:text="${mensaje}">
            </div>

            <div th:if="${error}"
                 class="alert alert-danger"
                 th:text="${error}">
            </div>

            <form th:action="@{/caja/registrar}" method="post">

                <!-- Productos -->
                <div class="card mb-4">

                    <div class="card-header">
                        Productos disponibles
                    </div>

                    <div class="card-body">

                        <div th:if="${#lists.isEmpty(productos)}"
                             class="alert alert-warning">
                            No hay productos disponibles.
                        </div>

                        <div class="table-responsive">
                            <table class="table table-striped align-middle">

                                <thead>
                                    <tr>
                                        <th>Producto</th>
                                        <th>Precio</th>
                                        <th style="width: 150px;">Cantidad</th>
                                    </tr>
                                </thead>

                                <tbody>
                                    <tr th:each="producto : ${productos}">

                                        <td th:text="${producto.nombre}"></td>

                                        <td>
                                            ₡<span th:text="${producto.precio}"></span>
                                        </td>

                                        <td>
                                            <input type="number"
                                                   th:name="${'cantidad_' + producto.idProducto}"
                                                   class="form-control"
                                                   min="0"
                                                   max="20"
                                                   value="0">
                                        </td>

                                    </tr>
                                </tbody>

                            </table>
                        </div>

                    </div>
                </div>

                <!-- Información del pedido -->
                <div class="card mb-4">

                    <div class="card-header">
                        Información del pedido
                    </div>

                    <div class="card-body">

                        <!-- Usuario que registra -->
                        <div class="mb-3">

                            <label for="idUsuarioRegistra"
                                   class="form-label">
                                ID del usuario que registra
                            </label>

                            <input type="number"
                                   id="idUsuarioRegistra"
                                   name="idUsuarioRegistra"
                                   class="form-control"
                                   min="1"
                                   required>

                        </div>

                        <!-- Observaciones -->
                        <div class="mb-3">

                            <label for="notas" class="form-label">
                                Observaciones
                            </label>

                            <textarea id="notas"
                                      name="notas"
                                      class="form-control"
                                      rows="3"
                                      maxlength="500"></textarea>

                        </div>

                        <!-- Método de pago -->
                        <div class="mb-3">

                            <label for="metodoPago" class="form-label">
                                Método de pago
                            </label>

                            <select id="metodoPago"
                                    name="metodoPago"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Seleccione un método
                                </option>

                                <option value="TARJETA_SIMULADA">
                                    Tarjeta simulada
                                </option>

                                <option value="MOSTRADOR">
                                    Pago en mostrador
                                </option>

                            </select>

                        </div>

                        <!-- Botón -->
                        <button type="submit" class="btn btn-success">
                            Registrar pedido presencial
                        </button>

                    </div>
                </div>

            </form>

        </div>

    </body>
</html>
