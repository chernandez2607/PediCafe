<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de pagos - PediCafé</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">Gestión de pagos</h2>

    <div th:if="${mensaje}" class="alert alert-success"
         th:text="${mensaje}"></div>

    <div th:if="${error}" class="alert alert-danger"
         th:text="${error}"></div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID Pago</th>
                <th>Número de pedido</th>
                <th>Método</th>
                <th>Estado</th>
                <th>Monto</th>
                <th>Fecha de pago</th>
                <th>Acción</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="pago : ${pagos}">
                <td th:text="${pago.idPago}"></td>
                <td th:text="${pago.pedido.numeroPedido}"></td>
                <td th:text="${pago.metodoPago}"></td>
                <td th:text="${pago.estadoPago}"></td>
                <td th:text="${pago.monto}"></td>
                <td th:text="${pago.fechaPago}"></td>

                <td>
                    <form th:if="${pago.estadoPago == 'PENDIENTE'
                                  and pago.metodoPago == 'MOSTRADOR'}"
                          th:action="@{/pagos/confirmar}"
                          method="post">

                        <input type="hidden" name="idPago"
                               th:value="${pago.idPago}">

                        <label>Usuario que registra:</label>
                        <input type="number" name="idUsuarioRegistra"
                               class="form-control mb-2" required>

                        <button type="submit" class="btn btn-success btn-sm">
                            Confirmar pago
                        </button>
                    </form>

                    <span th:if="${pago.estadoPago == 'PAGADO'}"
                          class="badge bg-success">
                        Pagado
                    </span>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(pagos)}">
                <td colspan="7" class="text-center">
                    No hay pagos registrados.
                </td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
