
<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/nav :: head('Gestión de pagos')}"></head>
    <body>
        <div class="pc-app">

            <aside th:replace="~{fragments/nav :: sidebar('pagos')}"></aside>

            <div class="pc-main">

                <header th:replace="~{fragments/nav :: pageHeader(
                        'Administración',
                        'Gestión de pagos',
                        'Consulta y confirmación de pagos de los pedidos'
                        )}"></header>

                <main class="pc-content">

                    <div class="pc-content-heading">
                        <div>
                            <h2>Listado de pagos</h2>
                            <p>Consulta el estado y confirma los pagos de los pedidos.</p>
                        </div>
                        <span class="pc-count" th:text="${#lists.size(pagos)}">0</span>
                    </div>

                    <th:block th:replace="~{fragments/nav :: flashMessages}"></th:block>

                    <div class="pc-table-wrap table-responsive"
                         th:if="${!pagos.isEmpty()}">

                        <table class="table table-striped pc-table">
                            <thead>
                                <tr>
                                    <th>ID Pago</th>
                                    <th>Número de pedido</th>
                                    <th>Método</th>
                                    <th>Estado</th>
                                    <th>Monto</th>
                                    <th>Fecha de pago</th>
                                    <th class="text-end">Acción</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="pago : ${pagos}">
                                    <td class="fw-semibold" th:text="${pago.idPago}"></td>

                                    <td th:text="${pago.pedido.numeroPedido}"></td>

                                    <td th:text="${pago.metodoPago}"></td>

                                    <td>
                                        <span class="pc-status"
                                              th:classappend="${pago.estadoPago == 'PENDIENTE'} ? ' inactive' : ''"
                                              th:text="${pago.estadoPago == 'PAGADO' ? 'Pagado' : 'Pendiente'}">
                                            Pendiente
                                        </span>
                                    </td>

                                    <td th:text="${pago.monto}"></td>

                                    <td th:text="${pago.fechaPago}"></td>

                                    <td>
                                        <div class="pc-row-actions justify-content-end">

                                            <form th:if="${pago.estadoPago == 'PENDIENTE'
                                                  and pago.metodoPago == 'MOSTRADOR'}"
                                                  th:action="@{/pagos/confirmar}"
                                                  method="post">

                                                <input type="hidden"
                                                       name="idPago"
                                                       th:value="${pago.idPago}">

                                                <input type="number"
                                                       name="idUsuarioRegistra"
                                                       class="form-control form-control-sm mb-2"
                                                       placeholder="ID del usuario"
                                                       required>

                                                <button type="submit"
                                                        class="btn btn-pc-light btn-sm">
                                                    Confirmar pago
                                                </button>
                                            </form>

                                            <span th:if="${pago.estadoPago == 'PAGADO'}"
                                                  class="pc-status">
                                                ✓ Confirmado
                                            </span>

                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="pc-empty"
                         th:if="${pagos.isEmpty()}">
                        Todavía no hay pagos registrados.
                    </div>

                </main>
            </div>
        </div>
    </body>
</html>
