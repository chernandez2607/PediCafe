spring.application.name=pedicafe
server.port=8080

# Conexion MySQL Aiven Ya utiliza el Aiven de nosotros!
spring.datasource.url=jdbc:mysql://pedicafesql-pedicafeg7-e669.g.aivencloud.com:25589/pediCafe?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${AIVEN_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect




# Solo valida el esquema existente; nunca crea ni modifica tablas.
spring.jpa.hibernate.ddl-auto=validate

# Preserva los nombres fisicos camelCase definidos con @Table/@Column/@JoinColumn.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.thymeleaf.cache=false
spring.jpa.properties.hibernate.format_sql=true


